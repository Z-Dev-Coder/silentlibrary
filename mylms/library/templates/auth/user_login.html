{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Silent Library{% endblock %}

{% block extra_css %}
<style>
    .login-card {
        border: none;
        border-radius: 15px;
    }
    .login-header {
        background-color: var(--nav-bg) !important;
        border-radius: 15px 15px 0 0 !important;
        padding: 1.5rem;
    }
    .input-group-text {
        background-color: #f8f9fa;
        color: var(--nav-bg);
        border-right: none;
    }
    .form-control {
        border-left: none;
    }
    .form-control:focus {
        border-color: #ced4da;
        box-shadow: none;
    }
    .btn-login {
        background-color: var(--accent-color);
        border: none;
        font-weight: bold;
        padding: 0.8rem;
        transition: transform 0.2s;
    }
    .btn-login:hover {
        background-color: #0ea371;
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg login-card">
            <div class="card-header login-header text-white text-center">
                <h3 class="mb-0 fw-bold"><i class="fas fa-lock me-2 text-info"></i> Member Login</h3>
            </div>
            <div class="card-body p-4">
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="email" class="form-label small fw-bold text-muted">GMAIL ADDRESS</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" id="email" 
                                   placeholder="name@gmail.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label small fw-bold text-muted">PASSWORD</label>
                            <a href="{% url 'password_reset' %}" class="small text-decoration-none">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" class="form-control" id="password" 
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-login text-white rounded-pill">
                            SIGN IN
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted small">
                        New to the library? 
                        <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">
                            Create an Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="{% url 'home' %}" class="text-muted small text-decoration-none">
                <i class="fas fa-chevron-left me-1"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
